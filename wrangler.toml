# Хичээлийн үнэлгээ — one Worker serves the website (public/) and the API (/api/*).
#
# This is the TEST setup on the personal Cloudflare account. It deploys as a
# NEW Worker called "mnsa-course", so the live site (mongol-course-frontend +
# mongol-course-api on course.icpsd.org) keeps running untouched until cutover.
# See README.md for the full steps.

name = "mnsa-course"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Gives the test site a free address: https://mnsa-course.<your-subdomain>.workers.dev
workers_dev = true

# Static files. Only what is inside public/ is published — nothing else in the
# repo (wrangler.toml, migrations, README…) can leak onto the website.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Only these email domains may request a login code (comma-separated).
ALLOWED_EMAIL_DOMAINS = "stu.pku.edu.cn"
# Must be an address on a domain verified in Resend.
MAIL_FROM = "Хичээлийн үнэлгээ <noreply@course.icpsd.org>"
# Link printed at the bottom of the login email.
SITE_URL = "https://course.icpsd.org"

# Secrets — set with `npx wrangler secret put <NAME>`, never written in this file:
#   JWT_SECRET      signs login tokens and hashes login codes
#   RESEND_API_KEY  sends the login-code emails

[[d1_databases]]
binding = "DB"
database_name = "mnsa-course-db"
# Paste the id printed by `npx wrangler d1 create mnsa-course-db` (README step 2).
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"

# Custom domain — add only at cutover (README step 6), after the old Workers
# have released course.icpsd.org:
# routes = [
#   { pattern = "course.icpsd.org", custom_domain = true }
# ]
