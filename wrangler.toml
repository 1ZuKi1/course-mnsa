# Хичээлийн үнэлгээ — one Worker serves the website (public/) and the API (/api/*).
#
# Live site: https://course.pkumongolia.com on the student association's
# Cloudflare account (moved from the personal account / course.icpsd.org).

name = "mnsa-course"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Gives the test site a free address: https://mnsa-course.<your-subdomain>.workers.dev
workers_dev = true

# Live address — `npm run deploy` attaches it to this Worker. Must stay above
# the first [section] below, or TOML would read it as part of that section.
routes = [
  { pattern = "course.pkumongolia.com", custom_domain = true }
]

# Static files. Only what is inside public/ is published — nothing else in the
# repo (wrangler.toml, migrations, README…) can leak onto the website.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Only these email domains may request a login code (comma-separated).
ALLOWED_EMAIL_DOMAINS = "stu.pku.edu.cn"
# Must be an address on a domain verified in Resend.
MAIL_FROM = "Хичээлийн үнэлгээ <noreply@pkumongolia.com>"
# Link printed at the bottom of the login email.
SITE_URL = "https://course.pkumongolia.com"

# Secrets — set with `npx wrangler secret put <NAME>`, never written in this file:
#   JWT_SECRET      signs login tokens and hashes login codes
#   RESEND_API_KEY  sends the login-code emails

[[d1_databases]]
binding = "DB"
database_name = "mnsa-course-db"
# The association account's database: paste the id printed by
# `npx wrangler d1 create mnsa-course-db` (README Phase 2, step 3).
database_id = "1ae3b0a1-9986-49cf-ba1f-063ad4267baf"
migrations_dir = "migrations"
